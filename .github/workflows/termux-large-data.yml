name: Termux large-data compatibility

on:
  push:
    branches: ["parser/semantic-spanish"]
    paths:
      - 'src/dataset.c'
      - 'include/dataset.h'
      - 'include/common.h'
      - 'src/common.c'
      - '.github/workflows/termux-large-data.yml'
  pull_request:
    paths:
      - 'src/dataset.c'
      - 'include/dataset.h'
      - 'include/common.h'
      - 'src/common.c'
      - '.github/workflows/termux-large-data.yml'
  workflow_dispatch:
    inputs:
      rows:
        description: 'Filas del ensayo de importación'
        required: true
        default: '100000'

permissions:
  contents: read

jobs:
  large-csv-import:
    name: Importación CSV grande (Termux-compatible)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROWS: ${{ inputs.rows || '100000' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build stress harness
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/test_large_dataset.c <<'C'
          #include "dataset.h"
          #include <assert.h>
          #include <stdio.h>
          #include <stdlib.h>
          int main(void) {
              const char *path = "large-import.csv";
              size_t rows = 100000;
              const char *env = getenv("ROWS");
              if (env && *env) rows = (size_t)strtoull(env, NULL, 10);
              FILE *f = fopen(path, "wb");
              assert(f);
              fputs("id,valor,grupo,nota\n", f);
              for (size_t i = 0; i < rows; ++i)
                  fprintf(f, "%zu,%zu,%zu,registro-%zu\n", i, i * 3, i % 16, i);
              assert(fclose(f) == 0);
              Dataset dataset;
              dataset_init(&dataset);
              DatasetLimits limits = { rows, 4, 1024 };
              MilenaError error;
              MilenaStatus status = dataset_load_csv_with_limits(
                  &dataset, path, ',', &limits, &error);
              assert(status == MILENA_OK);
              assert(dataset.column_count == 4);
              assert(dataset.row_count == rows);
              assert(dataset.invalid_rows == 0);
              dataset_destroy(&dataset);
              remove(path);
              puts("OK: large CSV import");
              return 0;
          }
          C
          clang -std=c17 -Wall -Wextra -Wpedantic -Wshadow -Wconversion -O2 \
            -Iinclude /tmp/test_large_dataset.c src/dataset.c src/common.c -lm \
            -o /tmp/test_large_dataset
      - name: Run large import
        run: /tmp/test_large_dataset
