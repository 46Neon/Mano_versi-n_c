name: Publish Milena Termux APT repository

concurrency:
  group: milena-termux-apt
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la Release que contiene los paquetes .deb'
        required: true
        default: 'v0.1.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  publish-apt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install APT tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Select release tag
        id: release
        shell: bash
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Debian packages from Release
        shell: bash
        run: |
          mkdir -p dist/inputs
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' \
            --dir dist/inputs \
            --clobber
          test -n "$(find dist/inputs -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Import signing key
        shell: bash
        env:
          MILENA_GPG_PRIVATE_KEY: ${{ secrets.MILENA_GPG_PRIVATE_KEY }}
        run: |
          test -n "$MILENA_GPG_PRIVATE_KEY"
          printf '%s\n' "$MILENA_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Generate signed repository
        shell: bash
        env:
          MILENA_GPG_KEY_ID: ${{ secrets.MILENA_GPG_KEY_ID }}
          MILENA_GPG_PASSPHRASE: ${{ secrets.MILENA_GPG_PASSPHRASE }}
        run: |
          test -n "$MILENA_GPG_KEY_ID"
          test -n "$MILENA_GPG_PASSPHRASE"
          KEY_ID="$(printf '%s' "$MILENA_GPG_KEY_ID" | tr -d '[:space:]')"
          KEY_ID="${KEY_ID#rsa3072/}"
          KEY_ID="${KEY_ID#0x}"
          export MILENA_GPG_KEY_ID="$KEY_ID"
          ./packaging/termux/generate-apt-repo.sh dist/inputs dist/apt
          gpg --batch --armor --export "$KEY_ID" > dist/apt/milena-archive-keyring.asc
          test -s dist/apt/milena-archive-keyring.asc

      - name: Validate APT repository
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/apt/dists/stable/Release
          test -s dist/apt/dists/stable/InRelease
          test -s dist/apt/dists/stable/Release.gpg
          test -s dist/apt/dists/stable/main/binary-aarch64/Packages
          test -s dist/apt/dists/stable/main/binary-aarch64/Packages.gz
          grep -Fq 'Package: milena' dist/apt/dists/stable/main/binary-aarch64/Packages
          test -n "$(find dist/apt/pool -type f -name '*.deb' -print -quit)"
          dpkg-deb --info "$(find dist/apt/pool -type f -name '*.deb' -print -quit)"

      - name: Create repository checksums
        shell: bash
        run: |
          set -euo pipefail
          find dist/apt -type f -print0 | sort -z | xargs -0 sha256sum > dist/apt/SHA256SUMS
          test -s dist/apt/SHA256SUMS

      - name: Install Netlify CLI
        run: npm install --global netlify-cli

      - name: Publish APT repository to Netlify
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"
          netlify deploy --dir=dist/apt --prod --site="$NETLIFY_SITE_ID" --message="Milena Termux ${{ steps.release.outputs.tag }}"
