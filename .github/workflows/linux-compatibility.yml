name: Linux compatibility and quality

on:
  push:
    branches: ["main", "parser/semantic-spanish"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build-test:
    name: ${{ matrix.compiler }} / Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            compiler: gcc
            cc: gcc
            cxx: g++
          - ubuntu: "22.04"
            compiler: clang
            cc: clang
            cxx: clang++
          - ubuntu: "24.04"
            compiler: gcc
            cc: gcc
            cxx: g++
          - ubuntu: "24.04"
            compiler: clang
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      LC_ALL: C

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang gcc g++ make cppcheck

      - name: Verify version metadata
        shell: bash
        run: |
          test -s VERSION
          version="$(tr -d '[:space:]' < VERSION)"
          test "$version" != ""
          echo "Milena version: $version"

      - name: Build with warnings report
        shell: bash
        run: |
          mkdir -p ci-artifacts
          make clean
          set +e
          make 2>&1 | tee ci-artifacts/build-${{ matrix.compiler }}.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Run tests and preserve diagnostics
        shell: bash
        run: |
          set +e
          make test 2>&1 | tee ci-artifacts/test-${{ matrix.compiler }}.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Static analysis report
        if: always()
        shell: bash
        run: |
          cppcheck --enable=warning,style --inconclusive --quiet \
            --suppress=missingIncludeSystem src include \
            2> ci-artifacts/cppcheck-${{ matrix.compiler }}.log || true

      - name: Upload Linux diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.ubuntu }}-${{ matrix.compiler }}-diagnostics
          path: ci-artifacts/
          if-no-files-found: warn

  sanitizer:
    name: Linux sanitizers
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install sanitizer toolchain
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y clang make

      - name: Build debug/sanitizer target
        run: make clean && CC=clang make debug

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make test

